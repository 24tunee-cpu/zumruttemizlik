# Netlify'da Vercel Cron yok — günlük drip için GitHub Actions tetikleyici.
# Secrets: SITE_URL (örn. https://www.zumrutvaditemizlik.com), CRON_SECRET
name: Publish due blogs

on:
  schedule:
    # 05:00 UTC ≈ 08:00 TR — eski Vercel cron ile hizalı
    - cron: '0 5 * * *'
  workflow_dispatch:

concurrency:
  group: publish-due-blogs
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call publish-blogs cron
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${SITE_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "SITE_URL veya CRON_SECRET eksik — workflow_dispatch/secrets kontrol edin."
            exit 1
          fi
          BASE="${SITE_URL%/}"
          code=$(curl -sS -o /tmp/cron-out.json -w "%{http_code}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${BASE}/api/cron/publish-blogs")
          echo "HTTP $code"
          cat /tmp/cron-out.json
          test "$code" = "200"
