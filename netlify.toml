# Netlify — GitHub bağlanınca Vercel gibi push→deploy
# Plugin SSR/API/ISR'yi yönetir; eski manuel /api redirect'ler kaldırıldı.

[build]
  command = "npm run build:app"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  # Install sırasında production omit → prisma/postinstall kırılıyor
  NPM_CONFIG_PRODUCTION = "false"
  NPM_FLAGS = "--legacy-peer-deps"
  # Free build worker OOM (tsc ~2GB) — heap + NETLIFY skip typecheck
  NODE_OPTIONS = "--max-old-space-size=4096"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  # Free tier koruması — uzun SEO cron'ları Netlify'da şimdilik yok
  node_bundler = "esbuild"

# NODE_ENV=production install aşamasında koyma (devDeps atlanır).
# Runtime'da Netlify kendisi production set eder.

[context.deploy-preview.environment]
  NEXT_PUBLIC_IS_PREVIEW = "true"
